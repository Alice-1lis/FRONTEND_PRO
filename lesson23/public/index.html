<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Todo-list backend</title>

</head>

<body>
    <div class="container">
        <h1>Todo-List backend</h1>
        <form class="form" id="js--form">
            <input type="text" name="value" required class="form__input" placeholder="new text" id="js--form__input">
            <button type="submit" class="form__btn">Додати</button>
        </form>
        <ul id="js--todos-wrapper">
            <li class="todo-item">
                <input aria-label="checkbox" type="checkbox">
                <span class="todo-item__description">text</span>
                <button type="submit" class="todo-item__delete">Видалити</button>
            </li>
            <li class="todo-item todo-item--checked">
                <input aria-label="checkbox" type="checkbox">
                <span class="todo-item__description">text</span>
                <button type="submit" class="todo-item__delete">Видалити</button>
            </li>
        </ul>
    </div>
</body>

</html>
