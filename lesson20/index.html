<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
  <script src="./node_modules/jquery/dist/jquery.min.js" crossorigin="anonymous" defer></script>
  <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.js" crossorigin="anonymous" defer></script>
  <script src="homework_20.js" defer></script>
  <title>Document</title>
</head>

<body>

  <div class="container">
    <h1>Todo-List</h1>
    <form class="form js--form">
      <input type="text" name="value" required class="form__input js--form__input" placeholder="new text"
        label="new text">
      <button class="form__btn" type="submit">Додати</button>
    </form>
    <ul class="js--todos-wrapper">
      <li class="todo-item">
        <input aria-label="checkbox" type="checkbox">
        <span class="todo-item__description">text</span>
        <button type="button" class="todo-item__delete">Видалити</button>
      </li>
      <li class="todo-item todo-item--checked">
        <input aria-label="checkbox" type="checkbox">
        <span class="todo-item__description">text</span>
        <button type="button" class="todo-item__delete">Видалити</button>
      </li>
    </ul>
  </div>

  <div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="taskModalLabel">Завдання</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p id="taskModalText" class="mb-0"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

</body>
</html>
