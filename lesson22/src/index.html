<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.scss">
    <title>Document</title>
    
</head>

<body>
    <div class="container">
        <h1>Todo-List</h1>
        <img src ="coffee_2.jpg" alt="icon" class="image">
        <form class="form js--form">
            <input type="text" name="value" required class="form__input js--form__input" placeholder="new text">
            <button type="button" class="form__btn">Додати</button>
        </form>
        <ul class="js--todos-wrapper">
            <li class="todo-item">
                <input aria-label="checkbox" type="checkbox">
                <span class="todo-item__description">text</span>
                <button type="button" class="todo-item__delete">Видалити</button>
            </li>
            <li class="todo-item todo-item--checked">
                <input aria-label="checkbox" type="checkbox">
                <span class="todo-item__description">text</span>
                <button type="button" class="todo-item__delete">Видалити</button>
            </li>
        </ul>
    </div>
    <script src="homework_15.js"></script>
</body>

</html>
